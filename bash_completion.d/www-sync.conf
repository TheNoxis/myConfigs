_add_version() {
	local cur prev opts lists_path arg_site
	COMPREPLY=()
	cur="${COMP_WORDS[COMP_CWORD]}"
	prev="${COMP_WORDS[COMP_CWORD-1]}"
	opts="-p -g -h"
	lists_path='/var/www/'
	arg_site=''

	case "${prev}" in
		-p)
			COMPREPLY=( $( cd $lists_path && compgen -d -- ${cur}) )
			return 0
			;;
		-g)
			for (( i=0; i < ${#COMP_WORDS[@]}-1; i++)); do
				if [[ ${COMP_WORDS[i]} == @(-p|--product) ]]; then
					arg_site="${COMP_WORDS[$(( $i + 1 ))]}"
				fi
			done
			if [ -n "$arg_site" ]; then
				COMPREPLY=( $( cd "$lists_path/$arg_site" && compgen -d -- ${cur} | grep -E '^[0-9\.]+') )
			fi
			return 0
			;;
		*)
		;;
	esac

	COMPREPLY=( $(compgen -W "${opts}" -- ${cur}) )
}
complete -F _add_version add_version.sh


