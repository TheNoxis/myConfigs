#Usage:
#	edsh -s <site_web> -v <version> [-d]
#
_www-sync() {

	local cur prev opts lists_path arg_site
	COMPREPLY=()
	cur="${COMP_WORDS[COMP_CWORD]}"
	prev="${COMP_WORDS[COMP_CWORD-1]}"
	opts="-s -v -h"
	lists_path='/var/www/'
	arg_site=''

	case "${prev}" in
		-s)
			COMPREPLY=( $( cd $lists_path && compgen -d -- ${cur} | grep '^dev.*') )
			return 0
			;;
		-v)
			for (( i=0; i < ${#COMP_WORDS[@]}-1; i++)); do
				if [[ ${COMP_WORDS[i]} == @(-s|--site) ]]; then
					arg_site="${COMP_WORDS[$(( $i + 1 ))]}"
				fi
			done
			if [ -n "$arg_site" ]; then
				COMPREPLY=( $( cd "$lists_path/$arg_site" && compgen -d -- ${cur} | grep '^v.*') )
			fi
			return 0
			;;
		*)
		;;
	esac

	COMPREPLY=( $(compgen -W "${opts}" -- ${cur}) )
}
complete -F _www-sync www-sync








