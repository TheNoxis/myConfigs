[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cvss"
version = "1.0.0"
description = "CVS status scanner"
requires-python = ">=3.8"
dependencies = [
    "prettytable",
    "termcolor",
    "argcomplete",
]

[project.scripts]
cvss = "cvss:cli"